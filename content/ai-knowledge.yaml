    answer: >-
      Matt enjoys turning shared ideas into practical experiences, and he looks
      for collaborators with different perspectives who will challenge his
      assumptions. He wants to learn from educators and people who work closely
      with communities, because they spot needs he might overlook as a builder.
      On a shared project he likes to own a clear deliverable and keep
      supporting it after it ships. Seeing people benefit from something he
      helped make is what brings him joy.
    source: Matt's Global Shapers application notes, October 2026.
    lastReviewed: 2026-10-22

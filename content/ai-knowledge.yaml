      At Ocat Robotics Matt was the designer engineer behind a biomimicry
      robotic penguin now deployed in Ocean Park. He crafted its hardware
      appearance in Shapr3D and Fusion 360, trained a YOLOv8 model with Roboflow
      for penguin detection and obstacle avoidance and deployed it on a Jetson
      Orin, and presented the work at IEEE RoboSoft.
    source: Matt's CV, September 2026.

  - id: education-mission
    topic: Teaching and Matt's education mission
    aliases:
      - teach
      - teaching
      - students
      - school
      - schools
      - education mission
      - edtech
      - workshop
      - 教學
      - 學生
      - 學校
    policy: answer
    answer: >-
      Through Incipe Academy, Matt has been bringing AI and hardware
      prototyping experiences to local schools in Hong Kong. What he cares about
      most is students building something useful for their own daily lives,
      rather than reproducing a set outcome, and leaving confident that they
      can create with technology. After class, students carry on in a
      technology community where they share news and products they have found.
      One student said he wanted to turn his project into a startup, which
      meant a lot to Matt. His wider mission is helping underserved students in
      Hong Kong gain that confidence.
    source: Matt's Global Shapers application notes, October 2026.
    lastReviewed: 2026-10-22
  - id: hong-kong
    topic: Hong Kong and the future Matt hopes for
    aliases:
      - Hong Kong
      - community
      - social impact
      - why does Matt care
      - vision
      - future
      - young people
      - 香港
      - 社區
      - 年輕人
    policy: answer
    answer: >-
      Matt cares about Hong Kong's young people having the opportunity and
      confidence to shape their own futures. He has noticed that personalised
      technology courses, the kind that support a student's own ideas, are
      often expensive, which puts them out of reach for many families. He
      believes creativity and critical thinking are becoming more valuable for
      the next generation in the AI era, and hopes for a Hong Kong where family
      income does not decide who gets to learn creative technology.
    source: Matt's Global Shapers application notes, October 2026.
    lastReviewed: 2026-10-22

    answer: >-
      For Project Melo Matt built an atomic design system in Obsidian paired
      with AI agents, letting marketing teams generate brand-compliant web
      sections instantly and saving about three hours a day. He also designed a
      membership app and admin portal for event bidding, and the app portal
      for Melo's events that connect local university students with industry
      CEOs, where his job was making taking part engaging for the students.
    source: Matt's CV, September 2026.

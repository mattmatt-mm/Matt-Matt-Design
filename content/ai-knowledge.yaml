    policy: answer
    answer: >-
      Matt does not hand out a one-off price before he understands a project.
      He sees quoting a fixed number up front as irresponsible, because a price
      set before the problem is understood tends to buy a bad result. He works
      in two ways: a subscription of HK$30,000 a month for unlimited design
      requests, or customised one-off pricing worked out once he knows what the
      project needs. For a tailored quote, the visitor can leave an email.
    source: Matt, 2026-10-22.
    lastReviewed: 2026-10-22
